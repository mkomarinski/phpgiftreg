[PHP]
; Suppress deprecation warnings for dynamic properties (Smarty 3.1.48 compatibility with PHP 8.2+)
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; Set display_errors based on environment
display_errors = On
log_errors = On
error_log = /var/log/apache2/php-error.log

; Performance settings
memory_limit = 256M
max_execution_time = 300
upload_max_filesize = 100M
post_max_size = 100M
