services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATA_DIR: /data
      SESSION_SECRET: ${SESSION_SECRET:-local-development-secret-change-before-deploying}
      TRUST_PROXY: "0"
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-}
    restart: unless-stopped
    volumes:
      - giftreg_data:/data

volumes:
  giftreg_data:
