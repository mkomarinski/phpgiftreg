services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${APP_PORT:-8080}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATA_DIR: /data
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      TRUST_PROXY: "1"
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-}
    restart: unless-stopped
    volumes:
      - giftreg_data:/data

volumes:
  giftreg_data:
